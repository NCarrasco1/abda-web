<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABDA · Organizador de tocador</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root { --ground:#FBEBEA; --powder:#F2D2CD; --ink:#3A2422; --rose:#9A4A40; --blush:#DD8E80; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:390px; height:844px; overflow:hidden; }
  body { background:var(--ground); color:var(--ink); font-family:"Barlow Condensed", sans-serif; position:relative; }
  .bar { background:var(--rose); color:#FFF4F2; font-size:13px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:7px 0; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px 6px; }
  header img { width:76px; height:76px; margin:-8px 0 -10px -8px; }
  header nav { margin-left:auto; display:flex; gap:18px; font-size:17px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; }
  header nav a { color:var(--ink); text-decoration:none; }
  .intro { position:relative; padding:4px 16px 16px; }
  h1 { font-size:44px; line-height:.92; font-weight:600; text-transform:uppercase; }
  h1 em { font-style:normal; color:var(--rose); }
  .script { position:absolute; right:16px; top:44px; font-family:"Mrs Saint Delafield", cursive; font-size:60px; color:var(--rose); transform:rotate(-8deg); }
  .tray { margin:0 12px; padding:9px; border-radius:22px; background:linear-gradient(160deg, rgba(255,255,255,.75), rgba(242,210,205,.55)); border:1.5px solid rgba(255,255,255,.95); box-shadow:0 18px 34px -16px rgba(154,74,64,.45), inset 0 0 0 1px rgba(221,142,128,.35);
          display:grid; grid-template-columns:1.25fr 1fr; grid-template-rows:150px 112px 132px; gap:9px; }
  .cell { position:relative; border-radius:14px; overflow:hidden; background:#fff; box-shadow:inset 0 3px 8px rgba(58,36,34,.18); text-decoration:none; color:inherit; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .lid { position:absolute; left:6px; right:6px; bottom:6px; padding:5px 9px 4px; border-radius:9px; background:rgba(251,235,234,.92); display:flex; justify-content:space-between; align-items:baseline; }
  .lid b { font-size:19px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .lid span { font-size:14px; font-weight:500; color:var(--rose); font-variant-numeric:tabular-nums; }
  .labios { grid-row:1 / span 2; }
  .lid.stack { display:block; } .lid.stack span { display:block; font-size:16px; }
  .vs { grid-column:2; grid-row:2 / span 2; }
  .vs .lid { background:rgba(154,74,64,.92); color:#FFF6F4; } .vs .lid span { color:#FBEBEA; }
  .wa { position:absolute; left:16px; right:16px; bottom:18px; height:54px; border-radius:27px; background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; font-size:20px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; box-shadow:0 8px 18px -6px rgba(154,74,64,.6); }
  .wa svg { width:22px; height:22px; }
  .row { grid-column:1; grid-row:3; display:grid; grid-template-columns:1fr 1fr; gap:9px; }
</style>
</head>
