# Publica el sitio en GitHub Pages cada vez que se sube un cambio a main.
# Basado en la guía oficial de Astro: https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite publicar a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

# Permisos para clonar el repo y publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se publica solo el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
