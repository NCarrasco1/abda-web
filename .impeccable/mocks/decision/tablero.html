<style>
  :root { --ground:#FBEBEA; --powder:#F2D2CD; --ink:#3A2422; --rose:#9A4A40; --blush:#DD8E80; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:390px; height:844px; overflow:hidden; }
  body { background:var(--ground); color:var(--ink); font-family:"Barlow Condensed", sans-serif; position:relative; }
  .bar { background:var(--rose); color:#FFF4F2; font-size:13px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:7px 0; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 0; }
  header img { width:76px; height:76px; margin:-8px 0 -10px -8px; }
  header nav { display:flex; gap:18px; font-size:17px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; }
  header nav a { color:var(--ink); text-decoration:none; }
  h1 { font-size:46px; line-height:.92; font-weight:600; text-transform:uppercase; letter-spacing:-.01em; padding:14px 16px 0; }
  h1 em { font-style:normal; color:var(--rose); }
  .wall { position:relative; height:470px; margin-top:6px; }
  .tape { position:absolute; width:86px; height:24px; background:repeating-linear-gradient(90deg, rgba(221,142,128,.55) 0 6px, rgba(242,210,205,.7) 6px 12px); box-shadow:0 1px 2px rgba(58,36,34,.12); }
  .shot { position:absolute; background:#fff; padding:6px; box-shadow:0 10px 22px -8px rgba(58,36,34,.35); }
  .shot img { display:block; width:100%; height:100%; object-fit:cover; }
  .cover { left:52px; top:18px; width:228px; height:300px; transform:rotate(-3deg); }
  .cover .tape { top:-12px; left:70px; transform:rotate(4deg); }
  .script { position:absolute; left:14px; top:286px; font-family:"Mrs Saint Delafield", cursive; font-size:84px; color:var(--rose); transform:rotate(-6deg); line-height:1; }
  .item { position:absolute; width:132px; }
  .item .shot { position:relative; height:132px; }
  .item .tape { width:60px; height:18px; top:-9px; left:36px; }
  .tag { margin-top:8px; font-size:17px; font-weight:500; text-transform:uppercase; line-height:1.05; letter-spacing:.03em; }
  .tag b { display:block; font-size:20px; font-weight:600; color:var(--rose); font-variant-numeric:tabular-nums; }
  .i1 { right:14px; top:34px; transform:rotate(4deg); }
  .i2 { right:20px; top:236px; transform:rotate(-2deg); }
  .ghost { position:absolute; left:124px; top:350px; width:92px; height:92px; border:1.5px dashed var(--blush); transform:rotate(3deg); display:grid; place-items:center; font-size:15px; font-weight:500; text-transform:uppercase; color:var(--rose); }
  .ghost .tape { width:44px; height:14px; top:-7px; left:26px; }
  .cats { display:flex; gap:8px; padding:0 16px; overflow:hidden; }
  .cats a { flex:none; font-size:17px; font-weight:500; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); text-decoration:none; padding:11px 14px; background:var(--powder); border-radius:2px; }
  .wa { position:absolute; left:16px; right:16px; bottom:18px; height:54px; border-radius:27px; background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; font-size:20px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; box-shadow:0 8px 18px -6px rgba(154,74,64,.6); }
  .wa svg { width:22px; height:22px; }
</style>
